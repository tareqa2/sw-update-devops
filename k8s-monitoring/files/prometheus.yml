global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Prometheus itself
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Test results pushed by CI. honor_labels keeps the suite/commit labels from the push.
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway.monitoring.svc.cluster.local:9091"]

  # The app: any Service in sw-update annotated prometheus.io/scrape: "true".
  # Discovery goes through EndpointSlices, so every backend pod is scraped directly.
  - job_name: sw-update-backend
    kubernetes_sd_configs:
      - role: endpointslice
        namespaces:
          names: [sw-update]
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_service_name]
        target_label: service
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
