# nginx config, mounted into the nginx pod as /etc/nginx/conf.d/default.conf.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sw-nginx-config
  namespace: sw-update
data:
  default.conf: |
    # Cache for static images, so repeat requests never reach Flask.
    proxy_cache_path /tmp/nginx-cache levels=1:2 keys_zone=static:10m max_size=50m inactive=60m;

    upstream sw_backend {
        server sw-backend:8000;          # the backend Service's DNS name
        keepalive 16;
    }

    server {
        listen 8080;                     # unprivileged nginx can't bind to 80
        server_name _;

        client_max_body_size 64k;        # API bodies are tiny; reject anything large
        server_tokens off;               # don't advertise the nginx version

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;

        gzip on;
        gzip_types application/json text/css application/javascript;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        # nginx's own liveness endpoint - answers even if the backend is down.
        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Metrics are for Prometheus inside the cluster, not for the internet.
        location = /metrics {
            return 404;
        }

        # Static images: cached by nginx and by the browser.
        location /static/ {
            proxy_pass http://sw_backend;
            proxy_cache static;
            proxy_cache_valid 200 60m;
            add_header X-Cache-Status $upstream_cache_status always;
            expires 1h;
        }

        # Everything else (UI pages and /api/v1) goes to Flask.
        location / {
            proxy_pass http://sw_backend;
        }
    }
