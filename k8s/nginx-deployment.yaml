apiVersion: apps/v1
kind: Deployment
metadata:
  name: sw-nginx
  namespace: sw-update
  labels:
    app: sw-nginx
spec:
  replicas: 2                 # stateless, so it can scale; rolling updates with zero downtime
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: sw-nginx
  template:
    metadata:
      labels:
        app: sw-nginx
      annotations:
        # Bump this (the pipeline does) to restart nginx when the ConfigMap changes.
        config/revision: "1"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101          # the "nginx" user in the unprivileged image
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.31.3-alpine   # pinned exact version, non-root nginx
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet: { path: /nginx-health, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /nginx-health, port: http }
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp      # pid file, temp files and the static cache
      volumes:
        - name: config
          configMap:
            name: sw-nginx-config
        - name: tmp
          emptyDir: {}
